name: Checks

on: [push, pull_request]

# Checks only read the code, so contributors' pull requests run with a read-only token.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lunarmodules/luacheck@cc089e3f65acdd1ef8716cc73a3eca24a6b845e4 # v1.2.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10.0.0
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4.3.0
      - run: luarocks install luacov
      # luacov counts the lines the tests reach, and the table goes on the run's summary page.
      # Coverage never fails the build; only the tests do.
      - run: lua -lluacov tests/run.lua
      - name: Show coverage
        run: |
          luacov
          {
            echo '### Lines the tests reach'
            echo '```'
            sed -n '/^File /,$p' luacov.report.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A released version always means the same files. Once the .toc's version has a tag, changing
  # the addon without bumping ## Version gets a warning, long before anyone tries to release it.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the addon hasn't changed since its version was released
        run: |
          version=$(sed -n 's/^## Version: *//p' ChatProfiles/ChatProfiles.toc | tr -d '\r')
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null \
            && ! git diff --quiet "v$version" HEAD -- ChatProfiles; then
            echo "::warning file=ChatProfiles/ChatProfiles.toc::ChatProfiles changed since v$version was released. Bump ## Version before the next release."
          fi
