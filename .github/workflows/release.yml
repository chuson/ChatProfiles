name: Release

# Pushing a tag like v0.2.0 builds ChatProfiles-v0.2.0.zip and publishes it as a GitHub release.
# A tag with a suffix, like v0.2.0-beta1, is published as a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lunarmodules/luacheck@v1
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - run: lua tests/run.lua

      - name: Check that the tag matches the .toc version
        run: |
          version=$(sed -n 's/^## Version: *//p' ChatProfiles/ChatProfiles.toc | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but ChatProfiles.toc says version $version." >&2
            exit 1
          fi

      # The zip holds one ChatProfiles folder, so it extracts straight into AddOns. The GPL
      # requires the license to go with every copy.
      - name: Build the zip
        run: |
          mkdir -p build
          cp -r ChatProfiles build/
          cp LICENSE build/ChatProfiles/
          (cd build && zip -r "ChatProfiles-$GITHUB_REF_NAME.zip" ChatProfiles)

      # release.json tells addon managers which game version each zip is for. The format and the
      # "forever" flavor match what the BigWigs packager writes.
      - name: Write release.json
        run: |
          interface=$(sed -n 's/^## Interface: *//p' ChatProfiles/ChatProfiles.toc | tr -d '\r')
          printf '{"releases":[{"name":"ChatProfiles","version":"%s","filename":"%s","nolib":false,"metadata":[{"flavor":"forever","interface":%s}]}]}\n' \
            "$GITHUB_REF_NAME" "ChatProfiles-$GITHUB_REF_NAME.zip" "$interface" > build/release.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "build/ChatProfiles-$GITHUB_REF_NAME.zip" build/release.json \
            --title "ChatProfiles $GITHUB_REF_NAME" --generate-notes $prerelease
